name: swipe_away
description: SwipeAway - your guide to Romanian accommodations
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get:
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.1
  crypto: ^3.0.3
  firebase_database: ^11.3.0
  firebase_core: ^3.10.0
  flutter_login: ^5.0.0
  flutter_rating_bar: ^4.0.0
  firebase_storage: ^12.4.0
  image_picker: ^1.0.4
  flutter_swipe_action_cell: ^3.1.2
  flutter_slidable: ^3.0.1
  intl: ^0.20.1
  carousel_slider: ^5.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_facebook_auth: ^7.0.1
  cached_network_image: ^3.2.3
  vibration: ^2.0.1
  js: ^0.6.5



dependency_overrides:
  flutter_tindercard:
  card_swiper:
  cached_network_image_web: ^1.0.1


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

dev_dependencies:
  flutter_test:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_lints: ^5.0.0